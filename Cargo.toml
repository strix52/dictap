[package]
name = "gemdict"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }
