[package]
name = "dictap"
version = "0.1.0"
edition = "2024"
description = "Tiny Windows dictation: press a hotkey, talk, and your words are pasted where you type"
license = "MIT"

[dependencies]
log = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_Time",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
cpal = "0.18.2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
